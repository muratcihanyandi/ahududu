name: ahududu
services:
  app:
    container_name: ahududu-app
    image: ghcr.io/muratcihanyandi/ahududu:latest
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "33470:33470"
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL tanimli degil. .env dosyasina ekleyin}
      UPLOAD_DIR: /data/uploads
      STATIC_DIR: /app/backend/static
      PORT: "33470"
      FIREBASE_CREDENTIALS_PATH: /data/secrets/firebase-service-account.json
    volumes:
      - /DATA/AppData/ahududu/uploads:/data/uploads
      - /DATA/AppData/ahududu/secrets:/data/secrets:ro
    labels:
      icon: "https://raw.githubusercontent.com/muratcihanyandi/ahududu/main/logo/ahududu_logo.png"

x-casaos:
  appstore:
    icon: https://raw.githubusercontent.com/muratcihanyandi/ahududu/main/logo/ahududu_logo.png
    port_map: "33470"
    title: Ahududu
  author: Murat
  category: Personal
  hostname: 192.168.2.170
  icon: https://raw.githubusercontent.com/muratcihanyandi/ahududu/main/logo/ahududu_logo.png
  index: ""
  is_uncontrolled: false
  port_map: "33470"
  scheme: http
  store_app_id: ahududu
  title:
    custom: Ahududu ❤️
