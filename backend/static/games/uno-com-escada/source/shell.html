<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uno Merdivenli — Pist</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:14px/1.4 -apple-system,Helvetica,Arial,sans-serif;color:#ddd}
#c{position:absolute;inset:0;margin:auto;width:100%;height:100%;display:block;object-fit:fill;touch-action:none}
#msg{position:absolute;left:0;right:0;top:45%;text-align:center;letter-spacing:.08em;white-space:pre-wrap}
#hint{display:none !important}
#hg,#ht,#hs,#tag,#ui{display:none;position:absolute;pointer-events:none}
#hg{right:1.6vh;bottom:1.6vh}
#ht{left:50%;top:1.6vh;transform:translateX(-50%)}
#hs{left:1.6vh;top:1.6vh}
#tag{left:50%;bottom:2.2vh;transform:translateX(-50%);padding:.45em 1.1em;border-radius:1.2em;background:rgba(9,11,14,.62);color:#fff;white-space:nowrap}
#ui{inset:0;pointer-events:auto;align-items:center;justify-content:center;background:rgba(6,8,10,.62);font-size:clamp(11px,1.72vh,17px)}
#ui.ini{background:linear-gradient(rgba(6,8,10,.5),rgba(6,8,10,.82))}
#ui>div{max-width:94vw;max-height:96vh;overflow:auto;padding:1.4em 2.2em;box-sizing:border-box;text-align:center}
#ui h1{margin:0;font-size:3.1em;line-height:1.1;letter-spacing:.02em;color:#fff}
#ui .sub{margin:.3em 0 1.3em;opacity:.8;letter-spacing:.12em;text-transform:uppercase;font-size:.9em}
#ui h2{margin:0 0 .5em;font-size:1.05em;letter-spacing:.1em;text-transform:uppercase;color:#ff8a6a}
#res{display:none;margin:0 0 1.4em;padding:1em 1.4em;border-radius:.8em;background:rgba(255,255,255,.07)}
#res table{margin:0 auto}#res th,#res td{padding:.2em 1.1em;text-align:right}#res td{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}#res p{margin:.7em 0 0}
#ui .bt{margin-top:1.5em}
#ui button{font:inherit;font-size:1.15em;font-weight:600;color:#fff;background:#d8351c;border:0;border-radius:.5em;padding:.6em 2em;margin:0 .4em;cursor:pointer}
#ui button+button{background:rgba(255,255,255,.16)}
#ui button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#mpStat{margin-top:.8em;font-size:.95em;color:#ffb4c8;font-weight:600}
#mpHud{display:none;position:fixed;right:14px;top:14px;padding:.4em .9em;border-radius:14px;background:rgba(9,11,14,.7);border:1px solid rgba(255,180,200,.32);color:#ffb4c8;font-size:12px;font-weight:600;line-height:1.35;text-align:right;pointer-events:none;z-index:12}
#mpTag{display:none;position:fixed;left:0;top:0;transform:translate(-50%,-100%);padding:.22em .65em;border-radius:999px;background:rgba(9,11,14,.72);border:1px solid rgba(255,180,200,.45);color:#fff;font-size:11px;font-weight:700;pointer-events:none;z-index:11;white-space:nowrap}
#touchui{display:none;position:fixed;inset:0;pointer-events:none;z-index:15}
body.has-touch:not(.menu-open) #touchui{display:block}
body.has-touch #hg{right:auto;left:50%;bottom:auto;top:1.4vh;transform:translateX(-50%)}
body.has-touch #ht{display:none !important}
.tbtn{position:fixed;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:999px;border:2px solid rgba(255,255,255,.45);color:#fff;font:inherit;font-weight:800;background:rgba(12,16,22,.52);box-shadow:0 4px 14px rgba(0,0,0,.45);cursor:pointer;padding:0;margin:0;box-sizing:border-box}
.tbtn .ic{line-height:1;font-size:1.1em}
.tbtn .lb{font-size:.34em;letter-spacing:.03em;opacity:.92;white-space:nowrap;line-height:1.1;margin-top:.12em}
.tbtn.on{background:rgba(216,53,28,.85);border-color:#fff;transform:scale(.94)}
#t-left{left:14px;bottom:14px;width:64px;height:64px;font-size:20px}
#t-right{left:88px;bottom:14px;width:64px;height:64px;font-size:20px}
#t-gas{right:14px;bottom:14px;width:72px;height:72px;font-size:22px}
#t-brake{right:96px;bottom:14px;width:60px;height:60px;font-size:18px}
#t-hand{right:14px;bottom:96px;width:52px;height:52px;font-size:16px}
#t-cam{left:14px;top:14px;width:44px;height:44px;font-size:14px}
#t-reset{left:64px;top:14px;width:44px;height:44px;font-size:14px}
#t-pause{left:114px;top:14px;width:44px;height:44px;font-size:14px}
#t-horn{left:14px;top:66px;width:44px;height:44px;font-size:14px}
#t-tp{left:64px;top:66px;width:44px;height:44px;font-size:14px}
@media (max-height:440px){
  #ui{font-size:clamp(9px,2.1vh,12px)}
  #ui>div{padding:.45em .9em}
  #ui h1{font-size:1.45em}
  #ui .sub{margin:.1em 0 .35em}
  #mpStat{margin-top:.35em}
  #ui .bt{margin-top:.4em}
  #ui button{padding:.45em 1.5em}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">yükleniyor…</div>
<div id="hint"></div>
<canvas id="hg"></canvas><canvas id="ht"></canvas><canvas id="hs"></canvas><div id="tag"></div><div id="mpHud"></div><div id="mpTag"></div>
<div id="mobrotate" style="display:none;position:fixed;inset:0;z-index:60;flex-direction:column;align-items:center;justify-content:center;gap:.6em;background:rgba(6,8,10,.94);color:#eee;text-align:center;padding:8vmin">
  <div style="font-size:15vmin">📱</div>
  <b style="font-size:4.8vmin;color:#fff">Telefonu yan çevir</b>
  <span style="font-size:3.1vmin;opacity:.75;line-height:1.5">Oyun yatay tam ekranda oynanıyor.</span>
</div>
<div id="ui"><div>
<h1>Uno Merdivenli</h1>
<p class="sub">Fiat Uno Mille EP 1996 · Dağ Pisti</p>
<div id="res"></div>
<div id="mpStat"></div>
<div class="bt"><button id="b0">Başla</button><button id="b1">Deneme Turu</button></div>
</div></div>
<div id="touchui">
  <button id="t-left" class="tbtn" type="button"><span class="ic">◀</span><span class="lb">SOL</span></button>
  <button id="t-right" class="tbtn" type="button"><span class="ic">▶</span><span class="lb">SAĞ</span></button>
  <button id="t-brake" class="tbtn" type="button"><span class="ic">▼</span><span class="lb">FREN</span></button>
  <button id="t-gas" class="tbtn" type="button"><span class="ic">▲</span><span class="lb">GAZ</span></button>
  <button id="t-hand" class="tbtn" type="button"><span class="ic">✋</span><span class="lb">EL</span></button>
  <button id="t-cam" class="tbtn" type="button"><span class="ic">🎥</span><span class="lb">KAM</span></button>
  <button id="t-reset" class="tbtn" type="button"><span class="ic">↺</span><span class="lb">PİST</span></button>
  <button id="t-pause" class="tbtn" type="button"><span class="ic">⏸</span><span class="lb">MENÜ</span></button>
  <button id="t-horn" class="tbtn" type="button"><span class="ic">📣</span><span class="lb">KORNA</span></button>
  <button id="t-tp" class="tbtn" type="button"><span class="ic">⚡</span><span class="lb">YANINA</span></button>
</div>
<script>
/*__CODE__*/
</script>
</body>
</html>
